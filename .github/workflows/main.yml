name: CI/CD Pipeline - React to Docker Hub & VM

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build Image & Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/varista-service:latest

  deploy:
    name: Deploy to Ubuntu VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Update VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Navigate to deployment folder
            cd ~/varista || { echo "Directory not found"; exit 1; }
            
            # 2. Login to Docker Hub (Uncommented for auth)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # 3. Overwrite the .env file (Added quotes to EOF to prevent variable expansion)
            cat <<'EOF' > .env
            ${{ secrets.ENV_FILE_CONTENT }}
            EOF
            
            # 4. Pull images defined in your docker-compose.yml
            docker compose pull
            
            # 5. Restart services
            docker compose up -d --force-recreate
            
            # 6. Cleanup (Optional but recommended to save disk space)
            docker image prune -f
