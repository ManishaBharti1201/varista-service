# Supply these required values through environment variables or external Spring configuration.
# Environment variable names: DB_USERNAME, DB_PASSWORD, MAIL_USERNAME, MAIL_PASSWORD, JWT_SECRET.
spring.datasource.url=jdbc:mysql://192.168.0.228:3306/hrms_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
varista.bankName=PUNJAB NATIONAL BANK
varista.accountNumber=685002100011758
varista.ifsc=PUNB0068500
springdoc.swagger-ui.use-root-path=true
invoice.directory=./invoice/
quotation.directory=./quotation/
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# HMAC secret used by the JwtDecoder (HS256); provide JWT_SECRET externally.
security.jwt.secret=${JWT_SECRET}

# Production defaults disable schema auto-update and SQL statement logging.
# Activate with SPRING_PROFILES_ACTIVE=prod; deployment overrides may use JPA_DDL_AUTO and JPA_SHOW_SQL.
#---
spring.config.activate.on-profile=prod
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
