spring.datasource.url=${DB_URL:jdbc:h2:file:./data/h2/varista;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:hrms_user}
spring.datasource.password=${DB_PASSWORD:root@1234}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
# Let Hibernate detect the dialect from the configured default tenant datasource.
# This supports both the local H2 fallback and the Leadac MySQL database.
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
management.health.db.enabled=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

varista.tenants[101].name=${TENANT_NAME_101:Leadac}
varista.tenants[101].url=${TENANT_DB_URL_101:jdbc:mysql://192.168.0.228:3306/syncra_leadac?useSSL=false&serverTimezone=UTC}
varista.tenants[101].username=${TENANT_DB_USERNAME_101:syncra_leadac_user}
varista.tenants[101].password=${TENANT_DB_PASSWORD_1:root@1234}

springdoc.swagger-ui.use-root-path=true
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:demo@example.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:demo-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
security.jwt.secret=${SECURITY_JWT_SECRET:local-dev-secret-change-me-1234567890}
